# Internal ADC channels the family port s32k1xx reads (reference and supply monitor of the safety task).
adc_internal:
  - { name: BANDGAP, instance: ADC0, channel: BANDGAP }
  - { name: ADCINTERNAL0, instance: ADC0, channel: INTERNAL0 }

# Safety section (platforms/<family>/port/safety, SafeIo and SafeState). What each pin does at run time:
#   safe_state_output: digital output of the board used as INDICATOR of the safe state: entering the safe state
#   disables the pin (it floats), leaving it switches it back to GPIO with the level the application last wrote.
#   Never an actuator (enable of a pump, motor, heater, relay): it would float in the safe state and come back on
#   when the safe state is left. Take an output the application does not write: if an rte.yaml dio.out connection
#   writes it, nxconfig warns until safety.safe_state_output_shared_with_application gives the reason (SYS-87,
#   AoU-30); one a device driver owns is refused.
#   locked_pin: digital output whose pin configuration is locked at start (PCR lock) and checked every safety
#   cycle; its level stays writable, but any reconfiguration is refused by the hardware and a changed direction
#   enters the safe state. Not the same output as safe_state_output.
#   test_pin: pin that is UNCONNECTED on the circuit: configured as GPIO input with pull-down and checked every
#   safety cycle (the console command `safety dst`/`est` switches it to enter/leave the safe state). A pin the
#   board file does not describe is not necessarily unconnected - check the schematic.
# chosen by the user when the project was created, not by the wizard.
safety:
  safe_state_output: LED1
  locked_pin: LED2
  test_pin: PTE13

# Non-volatile memory (stage C, FW-06): the calibration of the 14 cell channels lives in four NvM blocks (one value per channel,
# integrity asil_b = two copies with CRC-32, a defective copy is repaired from the other). The blocks are written some
# seconds after a change (ApplyCalibration), so a power cut right after the calibration loses at most that much.
# PARTITION: the emulated EEPROM needs the one-time FlexNVM partition of the chip (PGMPART), which only a complete erase
# undoes. It is NOT done by this file: it needs its own release of the user and the J-Link run with a backup beforehand (stage C,
# device part). The values below are the proposal for that release (same split as the eval board: 4 KB EEPROM, 32 KB D-flash,
# 32 KB backup, 20 CSEc key slots - the key space cannot be added later). Without the partition the blocks stay in RAM and
# start from their defaults.
nvm:
  partition:
    eeprom_bytes: 4096
    data_flash_bytes: 0x8000
    partition_code: 0xB
    load_on_reset: true
    key_slots: 20
  blocks:
    CalSetOffset:  {type: sint16, length: 14, integrity: asil_b, write: change, min_interval_ms: 2000}
    CalSetGain:    {type: uint16, length: 14, integrity: asil_b, write: change, min_interval_ms: 2000}
    CalMeasOffset: {type: sint16, length: 14, integrity: asil_b, write: change, min_interval_ms: 2000}
    CalMeasGain:   {type: uint16, length: 14, integrity: asil_b, write: change, min_interval_ms: 2000}
