# Generator output exception (NOTICE): this generated file may be used under terms of your choice.
# ECU description (tools/rtegen) of project battsim_master, created empty (TOOL-59): no software component yet.
# Format: swc/README.md and projects/README.md. Add components in neXtBSW Studio (step Komponenten).
# RTE-22: components[].path and can.dbc are relative to this file.
schema_version: 2
# One application task with the defaults of ecu/asyncCoreConfiguration/tasks.yaml (application_default).
# Without a runnables: list every runnable runs in it; the Studio writes the list as soon as
# a runnable is assigned or a second task is added.
tasks:
  - name: swc
    period_ms: 10
    priority: 30
    stack_bytes: 2048
components:
  - name: SupplyMonitor
    path: swc/SupplyMonitor
  - name: BattSimMode
    path: swc/BattSimMode
  - name: BattSimParams       # parameter component (RTE-47): the values that several components read
    path: swc/BattSimParams
  - name: CellCal             # calibration of the channels (stage C): staged by the diagnosis, held in the NvM
    path: swc/CellCal
  - name: CellChannels
    path: swc/CellChannels

# Global values (RTE-47/RTE-48, stage C): <Component>.<Parameter>: <ParameterComponent>.<Name>. The number of cell channels is a
# constant of the build (the dimension of the vector ports of CellCal and CellChannels, min = max = 14); the setpoint limit is
# a calibration value that CellChannels reads from the parameter component.
parameters:
  CellCal.CellCount: BattSimParams.CellCount
  CellChannels.CellCount: BattSimParams.CellCount
  CellChannels.SetpointLimit_V: BattSimParams.CellVoltLimit_V

# CAN matrix of the simulator (Stufe A): BattSimV1 content unchanged (LabControl driver stays valid) plus nodes, cycle
# times and 0x121 STATUS_BATTSIM_EXT; sender BATTSIM = this ECU, counterpart LABCONTROL (Board battsim-knoten-gegenseite).
# Timeouts per Board battsim-timeouts-stufe-a: only timeout qualifiers, Alive stays a normal signal until G3 (COM-54).
can:
  dbc: BattSimV2.dbc
  node: BATTSIM
  bus: CAN0
  task: swc
  monitor: [CONTROL_CELL16, CONTROL_DYNCELLSIM1, CONTROL_DYNCELLSIM2]   # received for their timeout qualifier, no port yet (cells 16 and cell model: Stufe D)
  qualifiers:
    # Timeout and alive counter of every control message of the LabControl driver (FW-03, COM-54, COM-56). The driver
    # counts 1..14 and wraps 14 -> 1 (the counting of the old firmware, answer bs-alive-rx b); 0 and 15 never occur and
    # are an alive error. counter_min/counter_max give that range, the wrap is a step of 1; max_delta_counter 2 tolerates
    # one lost frame. debounce_ms is 1.5 cycles: a single jump of the counter is bridged and heals with the next frame,
    # two wrong frames in a row are QLF_ERROR_ALIVE (the mode logic switches off with FAIL reason 2 in RUN). Values stay
    # as they were when a message is invalid (hold).
    CONTROL_BATTSIM:            # 0x130, 100 ms: Lebenszeichen der Steuerung; 300 ms = 3 Zyklen, Ausgaenge im selben 10-ms-Schritt aus
      timeout_ms: 300
      debounce_ms: 150
      on_error: hold
      alive: { counter: ALIVE_CONTROL_BATTSIM, counter_min: 1, counter_max: 14, max_delta_counter: 2 }
    CONTROL_CELL01_02_03:       # 0x100-0x105 alle 1000 ms, 3 Zyklen, letzte Werte gelten weiter (wie heute)
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_CELL01_02_03, counter_min: 1, counter_max: 14, max_delta_counter: 2 }
    CONTROL_CELL04_05_06:
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_CELL04_05_06, counter_min: 1, counter_max: 14, max_delta_counter: 2 }
    CONTROL_CELL07_08_09:
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_CELL07_08_09, counter_min: 1, counter_max: 14, max_delta_counter: 2 }
    CONTROL_CELL10_11_12:
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_CELL10_11_12, counter_min: 1, counter_max: 14, max_delta_counter: 2 }
    CONTROL_CELL13_14_15:
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_CELL13_14_15, counter_min: 1, counter_max: 14, max_delta_counter: 2 }
    CONTROL_CELL16:
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_CELL16, counter_min: 1, counter_max: 14, max_delta_counter: 2 }
    CONTROL_DYNCELLSIM1:        # 0x131, 100 ms, 3 Zyklen (Zellmodell kommt mit Stufe D)
      timeout_ms: 300
      debounce_ms: 150
      on_error: hold
      alive: { counter: ALIVE_CONTROL_DYNCELLSIM1, counter_min: 1, counter_max: 14, max_delta_counter: 2 }
    CONTROL_DYNCELLSIM2:        # 0x132, 1000 ms, 3 Zyklen
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_DYNCELLSIM2, counter_min: 1, counter_max: 14, max_delta_counter: 2 }

