# CAN matrix of the simulator (Stufe A): BattSimV1 content unchanged (LabControl driver stays valid) plus nodes, cycle
# times and 0x121 STATUS_BATTSIM_EXT; sender BATTSIM = this ECU, counterpart LABCONTROL (Board battsim-knoten-gegenseite).
# Timeouts per Board battsim-timeouts-stufe-a: only timeout qualifiers, Alive stays a normal signal until G3 (COM-54).
can:
  dbc: BattSimV2.dbc
  node: BATTSIM
  bus: CAN0
  task: swc
  monitor: [CONTROL_CELL16, CONTROL_DYNCELLSIM1, CONTROL_DYNCELLSIM2]   # received for their timeout qualifier, no port yet (cells 16 and cell model: Stufe D)
  qualifiers:
    # Timeout and alive counter of every control message of the LabControl driver (FW-03, COM-54). The driver counts
    # 0..15 and +1 per frame it sends (device-driver/battsim/driver.py), so the counter has its whole width and no
    # counter_min/counter_max; max_delta_counter 2 tolerates one lost frame. debounce_ms is 1.5 cycles: a single jump
    # of the counter is bridged and heals with the next frame, two wrong frames in a row are QLF_ERROR_ALIVE (the
    # mode logic switches off with FAIL reason 2 in RUN). Values stay as they were when a message is invalid (hold).
    CONTROL_BATTSIM:            # 0x130, 100 ms: Lebenszeichen der Steuerung; 300 ms = 3 Zyklen, Ausgaenge im selben 10-ms-Schritt aus
      timeout_ms: 300
      debounce_ms: 150
      on_error: hold
      alive: { counter: ALIVE_CONTROL_BATTSIM, max_delta_counter: 2 }
    CONTROL_CELL01_02_03:       # 0x100-0x105 alle 1000 ms, 3 Zyklen, letzte Werte gelten weiter (wie heute)
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_CELL01_02_03, max_delta_counter: 2 }
    CONTROL_CELL04_05_06:
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_CELL04_05_06, max_delta_counter: 2 }
    CONTROL_CELL07_08_09:
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_CELL07_08_09, max_delta_counter: 2 }
    CONTROL_CELL10_11_12:
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_CELL10_11_12, max_delta_counter: 2 }
    CONTROL_CELL13_14_15:
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_CELL13_14_15, max_delta_counter: 2 }
    CONTROL_CELL16:
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_CELL16, max_delta_counter: 2 }
    CONTROL_DYNCELLSIM1:        # 0x131, 100 ms, 3 Zyklen (Zellmodell kommt mit Stufe D)
      timeout_ms: 300
      debounce_ms: 150
      on_error: hold
      alive: { counter: ALIVE_CONTROL_DYNCELLSIM1, max_delta_counter: 2 }
    CONTROL_DYNCELLSIM2:        # 0x132, 1000 ms, 3 Zyklen
      timeout_ms: 3000
      debounce_ms: 1500
      on_error: hold
      alive: { counter: ALIVE_CONTROL_DYNCELLSIM2, max_delta_counter: 2 }

