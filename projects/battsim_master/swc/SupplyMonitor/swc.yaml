# Description of SupplyMonitor: the model SupplyMonitor.slx is the master (made by SupplyMonitor_create.m); this file is the
# description it matches, and tools/rtegen compares it with the generated ARXML. Written by tools/gen_swc_ports.py.
version: 1
name: SupplyMonitor
description: "48-V-Versorgung: Strom filtern, Ueberlast mit Hysterese, LIMIT-Leitung"
implementation: simulink
runnables:
  - name: SupplyTask10ms
    period_ms: 10
ports:
  - name: ISupply_mV
    direction: in
    type: uint32
    runnables: [SupplyTask10ms]
  - name: ISupplyQlf
    direction: in
    type: uint8
    runnables: [SupplyTask10ms]
  - name: Limit
    direction: in
    type: boolean
    runnables: [SupplyTask10ms]
  - name: Overload
    direction: out
    type: boolean
    runnables: [SupplyTask10ms]
  - name: SupplyCurrent_A
    direction: out
    type: float32
    runnables: [SupplyTask10ms]
  - name: LimitActive
    direction: out
    type: boolean
    runnables: [SupplyTask10ms]
  - name: CurrentInvalid           # the current measurement was invalid for CurrentInvalid_cycles samples in a row (C-1): BattSimMode switches off in RUN, FAIL reason 5
    direction: out
    type: boolean
    runnables: [SupplyTask10ms]
parameters:
  - name: SupplyCurrentFilter
    type: float32
    runnables: [SupplyTask10ms]
  - name: SupplyCurrentGain
    type: float32
    runnables: [SupplyTask10ms]
  - name: OverloadThd_mA
    type: float32
    runnables: [SupplyTask10ms]
  - name: OverloadHyst_mA
    type: float32
    runnables: [SupplyTask10ms]
  - name: CurrentInvalid_cycles
    type: uint8
    runnables: [SupplyTask10ms]
