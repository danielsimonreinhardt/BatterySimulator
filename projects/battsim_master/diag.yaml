          - {value: 1, text: OFF}

# --------------------------------------------------------------------- routines (service 31)
routines:
  - identifier: 0x0200
    name: ApplyCalibration
    label: Apply the staged calibration
    description: >-
      Takes the staged values of all channels over and stores them (NvM), if the outputs are off and every staged value
      is in range; otherwise nothing changes. The result is read with requestRoutineResults a moment later (the model
      runs every 10 ms): 0 applied, 1 refused (outputs on), 2 value out of range (badChannel names the channel),
      3 nothing to apply.
    group: calibration
    sessions: [Extended]
    security: Application
    start:
      call: {runnable: CellCal.CalTask10ms}
    results:
      call: {runnable: CellCal.CalTask10ms}
      response:
        - name: result
          label: Result of the latest request
          type: uint8
          values:
            - {value: 0, text: APPLIED}
            - {value: 1, text: REFUSED_OUTPUTS_ON}
            - {value: 2, text: VALUE_OUT_OF_RANGE}
            - {value: 3, text: NOTHING_TO_APPLY}
        - {name: badChannel, label: First channel with a value out of range (0 = none), type: uint8}

# --------------------------------------------------------------------- fault memory (services 19 / 14)
# Simplified DEM (decision 2026-09-21): status byte, debouncing, enable conditions, operation cycle, aging,
# snapshots and extended data - no warning lamp, no OBD. Without a partitioned EEPROM emulation the blocks
# DemEvents/DemEntries stay in RAM and the memory starts cleared after every start.
fault_memory:
  max_entries: 8
  overflow: replace_oldest
  snapshot_records_max: 1
  extended_records_max: 1
  aging_cycle: PowerCycle
  cycle_ms: 10
  write_interval_ms: 1000

# ------------------------------------------------------------------------ neXtBSW DTC range (TOOL-178)
# Block of the DTCs the basic software raises itself; the BSW DTCs below derive their numbers from it (plan in
# the header of tools/diaggen/standard_diag.yaml). Studio: page "Diagnose", tab "Grundlagen" (TOOL-189).
bsw_dtc_range:
  base: 0x160000
  size: 0x10000

dtcs:
  # RteSystem reports a violated deadline of a task cycle or a runnable (SYS-05) - recording only, the reaction
  # stays with the safe supervisor. A reported event matures on the first report.
  - name: RteDeadline
    label: RTE deadline violated
    description: A task cycle or a runnable took longer than its period (runtime supervision of the RTE, SYS-05).
    group: nextbsw
    severity: check_at_next_halt
    operation_cycle: PowerCycle
    enable_conditions: [EcuRunning]
    confirmation_threshold: 1
    priority: 2
    event:
      bsw: rte.deadline
      description: RteSystem reports FAILED on a violation and PASSED when a supervision window starts clean.
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    aging:
      threshold_cycles: 40
    snapshots:
      - record_number: 0x01
        label: Conditions at first confirmation
        dids: [EcuConditions, ActiveDiagnosticSession]
    extended_data:
      - record_number: 0x01
        label: Counters of the fault memory
        data:
          - {name: occurrenceCounter, label: Occurrence counter, counter: occurrence_counter}
          - {name: agingCounter, label: Aging counter, counter: aging_counter}

  # COM-46: the CAN system reports bus-off of every used bus (FAILED while the controller is bus-off, PASSED while
  # it is back on the bus, error passive included) - recording only, the recovery (pause, dropped frames, COM-35/37)
  # stays with the CAN system. bsw_instance is the index of the bus among the used CAN buses (+0x03nn).
  - name: CanBusOffCAN0
    label: CAN bus CAN0 bus-off
    description: The CAN controller of bus CAN0 went bus-off (transmit error counter above 255, COM-35).
    group: nextbsw
    severity: check_at_next_halt
    operation_cycle: PowerCycle
    enable_conditions: [EcuRunning]
    confirmation_threshold: 1
    priority: 2
    bsw_instance: 0
    event:
      bsw: can.busoff.CAN0
      description: The CAN system reports FAILED when the bus goes bus-off and PASSED when it is back on the bus.
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    aging:
      threshold_cycles: 40
    snapshots:
      - record_number: 0x01
        label: Conditions at first confirmation
        dids: [EcuConditions]
    extended_data:
      - record_number: 0x01
        label: Counters of the fault memory
        data:
          - {name: occurrenceCounter, label: Occurrence counter, counter: occurrence_counter}
          - {name: agingCounter, label: Aging counter, counter: aging_counter}

  # SYS-113: the cause of a safety reset (safe state S1 + reset S2 of the safe supervisor, a fault exception, the MCU
  # watchdog), reported after the next start: the reset-loop record of the family port (no-init RAM, SYS-43) keeps
  # the cause, the BSP task hands it to the fault memory (libs/bsw/dem dem/SafetyResetReport.h) - FAILED until the
  # fault memory took it over, then PASSED; every other cause PASSED. Recording only, the reaction was the
  # supervisor's. One report per start matures the DTC (no enable condition: a fault that resets again soon after
  # the start still gets its DTC). The number: +0x05FD MCU watchdog, +0x05FC fault exception, +0x05FB a safety
  # reset whose cause has no DTC of its own here (fixed sub-types, no bsw_instance); an event of the supervisor takes
  # its number in SafeSupervisor::Event as bsw_instance (+0x05nn, checked by nxconfig). Further causes: a DTC with event safety.<event in lower case> and its number, e.g.
  # safety.stack_overflow with bsw_instance 0x15. The held safe states (ROM check, watchdog self-test, the hold at
  # the reset-loop limit) end with a power cycle, which clears the record - no DTC after the next start; SYS-178: a
  # hold ended by a reset from outside (pin, debugger, SBC watchdog) counts as a safety reset, its cause is reported
  # after the next start - the ROM check as SafetyResetRomCheck (SYS-220), a device fault IDENTITY as
  # SafetyResetOther. SYS-179: S1 of the register check (no reset) is
  # SafetyCheckRegister. Both after HwShutoff at the end of this list (SYNC-1013: the event indexes of the
  # DTCs before them stay).
  - name: SafetyResetMcuWatchdog
    label: Safety reset by the MCU watchdog
    description: The MCU watchdog reset the ECU (program-flow supervision); reported after the next start (SYS-113).
    group: nextbsw
    severity: check_immediately
    operation_cycle: PowerCycle
    confirmation_threshold: 1
    priority: 1
    event:
      bsw: safety.mcu_watchdog
      description: The BSP task reports the cause of the safety reset before this start once (FAILED or PASSED).
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    aging:
      threshold_cycles: 40
    snapshots:
      - record_number: 0x01
        dids: [EcuConditions]
    extended_data:
      - record_number: 0x01
        data:
          - {name: occurrenceCounter, label: Occurrence counter, counter: occurrence_counter}
          - {name: agingCounter, label: Aging counter, counter: aging_counter}

  - name: SafetyResetFaultException
    label: Safety reset by a fault exception
    description: A fault exception of the core (hard fault, MPU, bus, usage, lockup) reset the ECU (SYS-113).
    group: nextbsw
    severity: check_immediately
    operation_cycle: PowerCycle
    confirmation_threshold: 1
    priority: 1
    event:
      bsw: safety.fault_exception
      description: The BSP task reports the cause of the safety reset before this start once (FAILED or PASSED).
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    aging:
      threshold_cycles: 40
    snapshots:
      - record_number: 0x01
        dids: [EcuConditions]
    extended_data:
      - record_number: 0x01
        data:
          - {name: occurrenceCounter, label: Occurrence counter, counter: occurrence_counter}
          - {name: agingCounter, label: Aging counter, counter: aging_counter}

  - name: SafetyResetDeadmanConfiguration
    label: Safety reset by the deadman configuration check
    description: The configuration of the halt deadman deviated; the safe supervisor reset the ECU (SYS-41, SYS-113).
    group: nextbsw
    severity: check_immediately
    operation_cycle: PowerCycle
    confirmation_threshold: 1
    priority: 1
    bsw_instance: 0x10
    event:
      bsw: safety.deadman_configuration_error
      description: The BSP task reports the cause of the safety reset before this start once (FAILED or PASSED).
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    aging:
      threshold_cycles: 40
    snapshots:
      - record_number: 0x01
        dids: [EcuConditions]
    extended_data:
      - record_number: 0x01
        data:
          - {name: occurrenceCounter, label: Occurrence counter, counter: occurrence_counter}
          - {name: agingCounter, label: Aging counter, counter: aging_counter}

  - name: SafetyResetOther
    label: Safety reset, other cause
    description: >-
      The safe supervisor reset the ECU for a cause without a DTC of its own in this description (SYS-113); the
      console line SAFETY RESET of that start names it.
    group: nextbsw
    severity: check_immediately
    operation_cycle: PowerCycle
    confirmation_threshold: 1
    priority: 1
    event:
      bsw: safety.reset_other
      description: The BSP task reports a safety reset before this start whose cause has no DTC here (fallback).
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    aging:
      threshold_cycles: 40
    snapshots:
      - record_number: 0x01
        dids: [EcuConditions]
    extended_data:
      - record_number: 0x01
        data:
          - {name: occurrenceCounter, label: Occurrence counter, counter: occurrence_counter}
          - {name: agingCounter, label: Aging counter, counter: aging_counter}

  # SYS-43/SYS-113: this start followed two or more safety resets in a row (the reset-loop counter of the no-init
  # record); the start at the configured limit holds the safe state without the fault memory and is not reported.
  - name: SafetyResetLoop
    label: Safety resets in a row
    description: The ECU started after two or more consecutive safety resets (reset-loop limit, SYS-43, SYS-113).
    group: nextbsw
    severity: check_immediately
    operation_cycle: PowerCycle
    confirmation_threshold: 1
    priority: 1
    event:
      bsw: safety.reset_loop
      description: The BSP task reports the reset-loop counter of the start once (FAILED from two in a row).
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    aging:
      threshold_cycles: 40
    snapshots:
      - record_number: 0x01
        dids: [EcuConditions]
    extended_data:
      - record_number: 0x01
        data:
          - {name: occurrenceCounter, label: Occurrence counter, counter: occurrence_counter}
          - {name: agingCounter, label: Aging counter, counter: aging_counter}

  # SYS-136/COM-49/COM-53: the hardware shut-off path (comparator -> timer fault input) tripped or a finding of its
  # path test - reported by RteSystem from the record of the safe supervisor; the freeze frame holds the context word of
  # the trip. Recording only, the reaction was the supervisor's (S1 held until reset). In a project without such a path
  # the DTC never fails (the record reads 0). After SafetyResetLoop: the event indexes (DemEvents) of the DTCs above stay.
  - name: HwShutoff
    label: Hardware shut-off path
    description: The hardware shut-off path of the PWM outputs tripped or its path test found a defect (SYS-136).
    group: nextbsw
    severity: check_immediately
    operation_cycle: PowerCycle
    confirmation_threshold: 1
    priority: 1
    event:
      bsw: safety.hw_shutoff
      description: RteSystem reports FAILED from the record of the safe supervisor (safety::hwShutoff::read).
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    aging:
      threshold_cycles: 40
    snapshots:
      - record_number: 0x01
        label: Context word at the trip
        dids: [HwShutoffContext]
    extended_data:
      - record_number: 0x01
        data:
          - {name: occurrenceCounter, label: Occurrence counter, counter: occurrence_counter}
          - {name: agingCounter, label: Aging counter, counter: aging_counter}

  # SYS-220 (review Supervisor B1, B1-2 a; SYNC-1013: after HwShutoff, so the event indexes of the DTCs above stay):
  # the ROM check (SM-14) holds the safe state; a reset from outside that ends
  # the hold counts as a safety reset (SYS-178) and is reported after the next start with a DTC of its own instead of
  # SafetyResetOther. The number: +0x0508, bsw_instance = SafeSupervisor::Event::ROM_CHECK_FAILURE. A fault that
  # persists holds again within the first pass of the check after the start, possibly before the fault memory stored
  # the DTC (AoU-57). The demo (projects/evalboard_s32k144_demo/diag.yaml) does not have it yet: it follows with the
  # next planned change of its NvM layout (a further DTC moves the block DemEvents, the fault memory starts empty once).
  - name: SafetyResetRomCheck
    label: Safety reset after a hold of the ROM check
    description: >-
      The ROM check found the image changed and held the safe state; a reset from outside (pin, debugger, SBC
      watchdog) ended the hold (SM-14, SYS-178, SYS-220).
    group: nextbsw
    severity: check_immediately
    operation_cycle: PowerCycle
    confirmation_threshold: 1
    priority: 1
    bsw_instance: 0x08
    event:
      bsw: safety.rom_check_failure
      description: The BSP task reports the cause of the safety reset before this start once (FAILED or PASSED).
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    aging:
      threshold_cycles: 40
    snapshots:
      - record_number: 0x01
        dids: [EcuConditions]
    extended_data:
      - record_number: 0x01
        data:
          - {name: occurrenceCounter, label: Occurrence counter, counter: occurrence_counter}
          - {name: agingCounter, label: Aging counter, counter: aging_counter}

  # SYS-179 (review Supervisor B1 2026-10-12, B1-5 a): S1 of the register check of the safe supervisor (SM-22,
  # CHECK_REGISTER_ERROR) - the one reaction that enters S1 without a reset and keeps the ECU running. RteSystem samples
  # the supervisor's read-only cause of S1 once per cycle of the fault memory (ecu/application dem/SafetyFaultReport.h):
  # FAILED while S1 of the register check lasts (or the supervisor's copy is implausible), PASSED once the return left
  # S1. Recording only. The number: +0x050D, bsw_instance = SafeSupervisor::Event::CHECK_REGISTER_ERROR. The demo
  # (projects/evalboard_s32k144_demo/diag.yaml) does not have it yet: it follows with the next planned change of its
  # NvM layout (a further DTC moves the block DemEvents, the fault memory starts empty once).
  - name: SafetyCheckRegister
    label: Safe state of the register check
    description: >-
      A register of the safety register lists (pin function, GPIO direction, clock gate, PWM timer, supervision)
      deviated; the safe supervisor holds the safe state without a reset until the check returns (SM-22, SYS-179).
    group: nextbsw
    severity: check_immediately
    operation_cycle: PowerCycle
    confirmation_threshold: 1
    priority: 1
    bsw_instance: 0x0D
    event:
      bsw: safety.check_register_error
      description: RteSystem samples the cause of S1 of the safe supervisor once per cycle (FAILED while it lasts).
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    aging:
      threshold_cycles: 40
    snapshots:
      - record_number: 0x01
        dids: [EcuConditions]
    extended_data:
      - record_number: 0x01
        data:
          - {name: occurrenceCounter, label: Occurrence counter, counter: occurrence_counter}
          - {name: agingCounter, label: Aging counter, counter: aging_counter}

  # BattSim stage C: the NvM block of a channel calibration started from its default because both copies were defective
  # (nvm.default_loaded.<Block>, libs/bsw/nvm): the calibration is lost, the channels run uncalibrated until it is applied again.
  # The number is bsw_dtc_range.base + 0x06nn (nn = index of the block). Recording only.
  - name: NvmDefaultCalSetOffset
    label: Calibration block CalSetOffset lost
    description: Both copies of the NvM block CalSetOffset were defective at the start; the channels use the factory values.
    group: calibration
    severity: check_at_next_halt
    operation_cycle: PowerCycle
    enable_conditions: [EcuRunning]
    confirmation_threshold: 1
    priority: 3
    bsw_instance: 3
    event:
      bsw: nvm.default_loaded.CalSetOffset
      description: The NvM reports FAILED when it loaded the default of the block and PASSED when it read the stored value.
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    snapshots:
      - record_number: 0x01
        label: Conditions at first confirmation
        dids: [EcuConditions]

  - name: NvmDefaultCalSetGain
    label: Calibration block CalSetGain lost
    description: Both copies of the NvM block CalSetGain were defective at the start; the channels use the factory values.
    group: calibration
    severity: check_at_next_halt
    operation_cycle: PowerCycle
    enable_conditions: [EcuRunning]
    confirmation_threshold: 1
    priority: 3
    bsw_instance: 2
    event:
      bsw: nvm.default_loaded.CalSetGain
      description: The NvM reports FAILED when it loaded the default of the block and PASSED when it read the stored value.
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    snapshots:
      - record_number: 0x01
        label: Conditions at first confirmation
        dids: [EcuConditions]

  - name: NvmDefaultCalMeasOffset
    label: Calibration block CalMeasOffset lost
    description: Both copies of the NvM block CalMeasOffset were defective at the start; the channels use the factory values.
    group: calibration
    severity: check_at_next_halt
    operation_cycle: PowerCycle
    enable_conditions: [EcuRunning]
    confirmation_threshold: 1
    priority: 3
    bsw_instance: 1
    event:
      bsw: nvm.default_loaded.CalMeasOffset
      description: The NvM reports FAILED when it loaded the default of the block and PASSED when it read the stored value.
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    snapshots:
      - record_number: 0x01
        label: Conditions at first confirmation
        dids: [EcuConditions]

  - name: NvmDefaultCalMeasGain
    label: Calibration block CalMeasGain lost
    description: Both copies of the NvM block CalMeasGain were defective at the start; the channels use the factory values.
    group: calibration
    severity: check_at_next_halt
    operation_cycle: PowerCycle
    enable_conditions: [EcuRunning]
    confirmation_threshold: 1
    priority: 3
    bsw_instance: 0
    event:
      bsw: nvm.default_loaded.CalMeasGain
      description: The NvM reports FAILED when it loaded the default of the block and PASSED when it read the stored value.
    debounce:
      counter: {failed_threshold: 1, passed_threshold: -1}
    snapshots:
      - record_number: 0x01
        label: Conditions at first confirmation
        dids: [EcuConditions]

# ------------------------------------------------------------------------- DTC groups (service 14)
# All DTCs (0xFFFFFF) and a single DTC number need no entry. NeXtBSW: every DTC of the basic software at once.
# Group identifier, first and last of NeXtBSW are derived from bsw_dtc_range (bsw: true).
dtc_groups:
  - name: NeXtBSW
    label: neXtBSW basic software
    description: DTCs the basic software raises itself (the whole neXtBSW range, bsw_dtc_range).
    bsw: true
