# PWM setpoint outputs (VOLTAGE_SET of the 14 cell channels, IO-116): every channel is an output of its own, one group per
# timer. The card inverts the signal (transistor Q8 with pull-up to 5 V), so the pin is low during the pulse and high at
# rest: duty 0 = 0 V, and the safe state of a channel is the pin high. Pins and timer channels as built, read off the
# KiCad netlist of the master (BatterieSimulator doc/hardware-system.html, "Master: Pinbelegung je Kanal"); channel 15
# (PTC11, FTM3_CH5) and 16 (PTC27, FTM4_CH4) are not fitted and not listed (board decision 26.10.).
pwm:
  - name: SET_FTM5
    instance: FTM5
    mode: single
    active_level: low
    verify: true
    channels:
      - { name: SET_05, channel: 0, pin: PTC9 }
      - { name: SET_01, channel: 1, pin: PTC8 }
      - { name: SET_02, channel: 2, pin: PTC29 }
      - { name: SET_03, channel: 3, pin: PTA7 }
